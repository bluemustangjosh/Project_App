<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - StudyDesk</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    :root {
        --sd-cream: #FBF3E7;
        --sd-cream-card: #FFFDF9;
        --sd-orange: #E8734A;
        --sd-orange-dark: #D9612F;
        --sd-text: #3A3A3A;
        --sd-text-muted: #8A8378;
        --sd-border: #E7DFCF;
        --sd-red: #C0392B;
        --sd-red-bg: #FBEAEA;
    }
 
    body {
        background-color: var(--sd-cream);
        color: var(--sd-text);
        font-family: 'Segoe UI', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
 
    .navbar {
        background-color: var(--sd-cream);
        border-bottom: 1px solid var(--sd-border);
    }
 
    .navbar-brand {
        font-weight: 700;
        color: var(--sd-text) !important;
        display: flex;
        align-items: center;
        gap: 10px;
    }
 
    .brand-icon {
        width: 36px;
        height: 36px;
        background-color: var(--sd-orange);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.1rem;
    }
 
    .auth-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }
 
    .login-card {
        background-color: var(--sd-cream-card);
        border: 1px solid var(--sd-border);
        border-radius: 14px;
        width: 100%;
        max-width: 400px;
        padding: 40px 36px;
    }
 
    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }
 
    .login-header .logo-circle {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background-color: var(--sd-orange);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 24px;
        color: white;
    }
 
    .login-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--sd-text);
        margin-bottom: 6px;
    }
 
    .login-header p {
        font-size: 0.9rem;
        color: var(--sd-text-muted);
        margin-bottom: 0;
    }
 
    .form-group {
        margin-bottom: 18px;
    }
 
    .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--sd-text);
        margin-bottom: 6px;
    }
 
    .form-group input {
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid var(--sd-border);
        border-radius: 8px;
        font-size: 0.95rem;
        background: #fff;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
 
    .form-group input:focus {
        border-color: var(--sd-orange);
        box-shadow: 0 0 0 3px rgba(232, 115, 74, 0.15);
    }
 
    .options-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
        font-size: 0.85rem;
    }
 
    .remember-me {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--sd-text-muted);
    }
 
    .remember-me input {
        width: auto;
    }
 
    .options-row a {
        color: var(--sd-orange);
        text-decoration: none;
        font-weight: 500;
    }
    .options-row a:hover {
        text-decoration: underline;
        color: var(--sd-orange-dark);
    }
 
    .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: var(--sd-orange);
        border: none;
        color: white;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    .btn-submit:hover {
        background-color: var(--sd-orange-dark);
    }
 
    .signup-link {
        text-align: center;
        margin-top: 22px;
        font-size: 0.9rem;
        color: var(--sd-text-muted);
    }
 
    .signup-link a {
        color: var(--sd-orange);
        font-weight: 600;
        text-decoration: none;
    }
    .signup-link a:hover {
        text-decoration: underline;
        color: var(--sd-orange-dark);
    }
 
    .error-box {
        background: var(--sd-red-bg);
        border: 1px solid #F0C7C0;
        color: var(--sd-red);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        margin-bottom: 18px;
    }
</style>
</head>
<body>
 
<nav class="navbar navbar-expand-md py-3">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            <span class="brand-icon">📚</span>
            StudyDesk
        </a>
    </div>
</nav>
 
<div class="auth-wrap">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-circle">📚</div>
            <h1>Welcome back</h1>
            <p>Sign in to keep chatting about your homework</p>
        </div>
 
        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}
 
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" placeholder="Enter your password" required>
            </div>
 
            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" name="remember_me">
                    Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
 
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn-submit">Sign In</button>
        </form>
 
        <div class="signup-link">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
