<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Classes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5" style="max-width: 600px;">
        <h1 class="mb-4">My Classes</h1>

        <!-- Add Class Form -->
        <form method="POST" action="{% url 'class_list' %}" class="mb-4">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Class Name</label>
                <input type="text" name="name" class="form-control" placeholder="Intro to Computer Science" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Class Code</label>
                <input type="text" name="code" class="form-control" placeholder="2103" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Section</label>
                <input type="text" name="section" class="form-control" placeholder="03" required>
            </div>

            <button type="submit" class="btn btn-primary">Add Class</button>
        </form>

        <!-- Class List -->
        <ul class="list-group">
        {% for class in classes %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ class.name }} ({{ class.code }}) - Section {{ class.section }}
                <a href="{% url 'delete_class' class.id %}" class="btn btn-sm btn-outline-danger">Delete</a>
            </li>
        {% empty %}
            <li class="list-group-item text-muted">No classes found.</li>
        {% endfor %}
        </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
